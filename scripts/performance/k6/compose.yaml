services:
  mysql:
    image: gcr.io/trillian-opensource-ci/db_server:v1.4.0
    environment:
      MYSQL_ROOT_PASSWORD: zaphod
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: zaphod
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin -h 127.0.0.1 -utest -pzaphod -s ping']
      interval: 2s
      timeout: 3s
      retries: 60
  trillian:
    image: rekor-trillian-log-server:latest
    command:
      - --quota_system=noop
      - --storage_system=mysql
      - --mysql_uri=test:zaphod@tcp(mysql:3306)/test?parseTime=true&interpolateParams=true
      - --rpc_endpoint=0.0.0.0:8090
      - --http_endpoint=0.0.0.0:8091
      - --alsologtostderr
    depends_on:
      mysql: {condition: service_healthy}
  signer:
    image: rekor-trillian-log-signer:latest
    command:
      - --quota_system=noop
      - --storage_system=mysql
      - --mysql_uri=test:zaphod@tcp(mysql:3306)/test?parseTime=true&interpolateParams=true
      - --rpc_endpoint=0.0.0.0:8090
      - --http_endpoint=0.0.0.0:8091
      - --force_master
      - --alsologtostderr
    depends_on:
      mysql: {condition: service_healthy}
  rekor:
    image: rekor-rekor-server:latest
    cpus: 2
    volumes:
      - ${PERF_DIR:-.}:/bench:ro
    entrypoint: [/bench/rekor-server]
    command:
      - serve
      - --trillian_log_server.address=trillian
      - --trillian_log_server.port=8090
      - --rekor_server.address=0.0.0.0
      - --rekor_server.hostname=benchmark.local
      - --rekor_server.signer=memory
      - --search_index.storage_provider=mysql
      - --search_index.mysql.dsn=test:zaphod@tcp(mysql:3306)/test?parseTime=true&interpolateParams=true
      - --enable_pprof
      - --log_type=prod
      - --trillian_log_server.cache_sth=${CACHE_STH:-false}
      - --trillian_log_server.sth_poll_interval=${POLL_INTERVAL:-100ms}
      - --trillian_log_server.proof_concurrency=${PROOF_CONCURRENCY:-32}
      - --rekor_server.checkpoint_cache_entries=${CHECKPOINT_ENTRIES:-128}
    ports:
      - 127.0.0.1:13000:3000
      - 127.0.0.1:12112:2112
      - 127.0.0.1:16060:6060
    depends_on:
      trillian: {condition: service_started}
      signer: {condition: service_started}
